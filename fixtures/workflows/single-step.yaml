{
  "type": "graph",
  "max_active_steps": 5,
  "retry_policy": {
    "limit": 0,
    "interval_sec": 1
  },
  "catchup_window": "",
  "overlap_policy": "skip",
  "labels": {
    "cairn_plan": "single-step",
    "cairn_generator": "14",
    "cairn_engine": "2.18.2",
    "cairn_graph_sha256": "023363d70cd46aedd427260a95ddb6ee60aae84d595e148e5d30c0fd9f0f5406",
    "cairn_body_sha256": "54581331f02c7f50400089d223beee603eff6e1b330f6d445c028c7fe5ab1d29"
  },
  "params": [
    {
      "CAIRN_REPOSITORY": "/srv/work/product"
    },
    {
      "CAIRN_PARENT_BRANCH": "main"
    },
    {
      "CAIRN_OCCASION": ""
    }
  ],
  "env": [
    {
      "PYTHONPATH": "/opt/cairn"
    },
    {
      "CAIRN_RUNS_DIR": "/srv/work/product/.git/cairn/runs"
    }
  ],
  "handler_on": {
    "exit": {
      "name": "lock_release",
      "working_dir": "${CAIRN_REPOSITORY}",
      "timeout_sec": 600,
      "retry_policy": {
        "limit": 0,
        "interval_sec": 1
      },
      "run": "python3 -m cairn lock release"
    }
  },
  "steps": [
    {
      "name": "lock_acquire",
      "working_dir": "${CAIRN_REPOSITORY}",
      "timeout_sec": 600,
      "retry_policy": {
        "limit": 0,
        "interval_sec": 1
      },
      "run": "python3 -m cairn lock acquire --plan single-step --run-timeout 82380"
    },
    {
      "name": "work_manifest_writer",
      "working_dir": "${CAIRN_REPOSITORY}",
      "timeout_sec": 79380,
      "retry_policy": {
        "limit": 0,
        "interval_sec": 1
      },
      "run": "python3 -m cairn agent run --provider claude --prompt 'Bring `src/release/manifest.py` to a state where it writes `dist/manifest.json` holding every artefact'\"'\"'s name, size and sha256.' --model sonnet",
      "preconditions": [
        {
          "condition": "python3 -m cairn marker absent --step manifest_writer --scope once"
        }
      ],
      "continue_on": {
        "failure": true,
        "skipped": true
      },
      "depends": [
        "lock_acquire"
      ]
    },
    {
      "name": "verify_manifest_writer",
      "id": "verify_manifest_writer",
      "run": "python3 -m pytest tests/test_manifest.py -q",
      "working_dir": "${CAIRN_REPOSITORY}",
      "timeout_sec": 600,
      "retry_policy": {
        "limit": 0,
        "interval_sec": 1
      },
      "preconditions": [
        {
          "condition": "python3 -m cairn verify needed --step manifest_writer --command-digest d9a648049bb8864206510aeb29814968bafe91bafa866e62a6b6d1edd60dff28 --bound 600"
        }
      ],
      "continue_on": {
        "failure": true,
        "skipped": true
      },
      "depends": [
        "work_manifest_writer"
      ]
    },
    {
      "name": "mark_manifest_writer",
      "run": "python3 -m cairn marker write --step manifest_writer --scope once",
      "working_dir": "${CAIRN_REPOSITORY}",
      "timeout_sec": 600,
      "retry_policy": {
        "limit": 0,
        "interval_sec": 1
      },
      "preconditions": [
        {
          "condition": "python3 -m cairn verify gate --step manifest_writer --position chain --verify-exit '${verify_manifest_writer.exit_code}'"
        }
      ],
      "depends": [
        "verify_manifest_writer"
      ]
    },
    {
      "name": "commit_manifest_writer",
      "working_dir": "${CAIRN_REPOSITORY}",
      "timeout_sec": 600,
      "retry_policy": {
        "limit": 0,
        "interval_sec": 1
      },
      "run": "python3 -m cairn commit --message 'cairn(manifest_writer): Manifest writer' --step manifest_writer",
      "depends": [
        "mark_manifest_writer"
      ]
    }
  ]
}
